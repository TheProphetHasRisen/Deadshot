<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nothing on file &middot; Deadshot Record Book</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#8E1520">
<style>__TOKENS__</style>
<style>
/* The page for an address that is not in the book. Until October 2026 this was the host's own
   bare "NOT_FOUND". It is drawn from the same theme tokens as the masthead, so it comes up in
   whichever of the themes the reader last chose, and no colour is written down here. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--mast-bg);color:var(--mast-ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--mast-ink);color:var(--mast-bg)}
.nf{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));text-align:center}
.nf-scope{position:absolute;left:50%;top:50%;width:min(132vmin,980px);height:min(132vmin,980px);transform:translate(-50%,-50%);color:var(--mast-sub);opacity:.2;pointer-events:none}
/* placed by offset from the centre, not inside the rings: the rings scale with the window and
   the words do not, so on a phone a mark drawn in ring-space landed on top of the button */
.nf-hit{position:absolute;left:calc(50% + 270px);top:calc(50% + 236px);width:46px;height:46px;transform:translate(-50%,-50%);color:var(--mast-kick);pointer-events:none}
@media(max-width:700px){.nf-hit{left:calc(50% + 98px);top:calc(50% - 208px);width:34px;height:34px}}
.nf-hud{position:relative;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mast-sub)}
.nf h1{position:relative;margin:14px 0 0;font-family:var(--wordmark);font-weight:900;font-size:clamp(76px,21vw,220px);line-height:.84;letter-spacing:.045em;text-transform:uppercase;
  text-shadow:0 0 20px var(--mast-glow),0 0 52px var(--mast-glow2)}
.nf-sub{position:relative;margin:10px 0 0;font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(17px,2.6vw,24px);color:var(--mast-sub)}
.nf p{position:relative;margin:22px 0 0;max-width:44ch;font-size:15px;line-height:1.6;color:var(--mast-sub)}
.nf-a{position:relative;display:inline-block;margin-top:28px;padding:12px 20px;border:1px solid var(--mast-sub);border-radius:2px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--mast-ink)}
.nf-a:hover,.nf-a:focus-visible{background:var(--mast-ink);color:var(--mast-bg);outline:none}
.nf-foot{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mast-sub);opacity:.75}
@media(max-height:520px){.nf-foot{display:none}.nf h1{font-size:clamp(60px,16vw,130px)}}
@media(prefers-reduced-motion:no-preference){
  .nf-hit{animation:nf-hit .5s cubic-bezier(.2,.9,.3,1.4) .25s both}
  @keyframes nf-hit{from{opacity:0;transform:translate(-50%,-50%) scale(1.5)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
}
</style>
</head>
<body>
<script>(function(){try{var k=localStorage.getItem("deadshot.skin");var ok=["scope","og","red","leather","arcade"];if(k==="redact"&&localStorage.getItem("deadshot.clearance")==="1")ok.push("redact");document.documentElement.setAttribute("data-skin",ok.indexOf(k)>-1?k:"red");}catch(e){document.documentElement.setAttribute("data-skin","red");}
try{var c=getComputedStyle(document.documentElement).getPropertyValue("--mast-bg").trim();if(c)document.querySelector('meta[name="theme-color"]').setAttribute("content",c);}catch(e){}})();</script>
<main class="nf">
  <!-- the sight picture: rings and a crosshair, dead centre -->
  <svg class="nf-scope" viewBox="0 0 600 600" aria-hidden="true" fill="none" stroke="currentColor">
    <circle cx="300" cy="300" r="286" stroke-width="2"/><circle cx="300" cy="300" r="204" stroke-width="1.5"/><circle cx="300" cy="300" r="118" stroke-width="1.5"/>
    <path d="M300 0V236M300 364V600M0 300H236M364 300H600" stroke-width="2"/>
    <path d="M300 66h-9m9 0h9M300 148h-6m6 0h6M300 452h-6m6 0h6M300 534h-9m9 0h9M66 300v-9m0 9v9M148 300v-6m0 6v6M452 300v-6m0 6v6M534 300v-9m0 9v9" stroke-width="2"/>
  </svg>
  <!-- and where the round actually went: well off the mark -->
  <svg class="nf-hit" viewBox="0 0 46 46" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round">
    <circle cx="23" cy="23" r="16" stroke-width="4.5"/><path d="M4 4l38 38M42 4L4 42" stroke-width="4.5"/>
  </svg>
  <div class="nf-hud">Range 404 &middot; no target</div>
  <h1>Missed</h1>
  <div class="nf-sub">Nothing on file at this address.</div>
  <p>The record book is a single page, and all __NSEASONSW__ seasons are on it.</p>
  <a class="nf-a" href="/">Back to the record book</a>
  <div class="nf-foot">Deadshot Archives &middot; est. __FIRSTYEAR__</div>
</main>
</body>
</html>
